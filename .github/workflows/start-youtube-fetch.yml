name: Start YouTube Fetch

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare-youtube-tools:
    runs-on: windows-latest
    timeout-minutes: 240

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Firefox and restore profile
        id: firefox
        shell: pwsh
        run: |
          & "$env:GITHUB_WORKSPACE\Firefox-Setup\scripts\setup-firefox.ps1" `
            -Workspace "$env:GITHUB_WORKSPACE\Firefox-Setup"

      - name: Open YouTube for 1 minute and close Firefox
        shell: pwsh
        env:
          FIREFOX_EXECUTABLE: ${{ steps.firefox.outputs.firefox_executable }}
        run: |
          & "$env:GITHUB_WORKSPACE\Firefox-Setup\scripts\verify-firefox.ps1" `
            -FirefoxExecutable "$env:FIREFOX_EXECUTABLE" `
            -ScreenshotDirectory "$env:RUNNER_TEMP\firefox-verification"

      - name: Set up Python for yt-dlp
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install yt-dlp
        shell: pwsh
        run: |
          python -m pip install --upgrade pip yt-dlp
          yt-dlp --version

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verify installed tools
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python --version
          yt-dlp --version
          node --version

      - name: Upload Firefox verification screenshot
        if: ${{ success() }}
        uses: actions/upload-artifact@v4
        with:
          name: firefox-verification-screenshot
          path: ${{ runner.temp }}/firefox-verification/*.jpg
          if-no-files-found: error
          retention-days: 7

      - name: Install Firebase fetch dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install requests firebase-admin google-cloud-firestore
          pip install requests firebase-admin beautifulsoup4

      - name: Run All Videos Fetch
        shell: pwsh
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          PYTHONIOENCODING: utf-8
          PYTHONUTF8: "1"
        run: |
          python All-Videos-Fetch.py

      - name: Run Live Videos Fetch
        shell: pwsh
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          PYTHONIOENCODING: utf-8
          PYTHONUTF8: "1"
        run: |
          python All-Live-Fetch.py
